# Render blueprint for the NextWave scheduling demo.
#
# Must live at the REPOSITORY ROOT — Render only looks for render.yaml here,
# not in subdirectories. `rootDir: server` below is what points the build and
# start commands at the server/ folder.
#
# In Render: New → Blueprint → connect this repo → select branch.
# Provisions the web service ONLY. This blueprint deliberately has no database:
# the app reads its database from the DATABASE_URL environment variable and
# nothing else, so the same code runs against whatever Postgres you point it at
# — an external staging instance now, AWS RDS later. Set DATABASE_URL in the
# dashboard; it must end ?sslmode=require (production refuses to start without TLS).
#
# TWO connection strings, because they do different jobs. DATABASE_URL is what the APP connects with — on Supabase, the
# TRANSACTION pooler (port 6543, ?pgbouncer=true). DIRECT_URL is what MIGRATIONS connect with — a direct connection or the
# SESSION pooler (port 5432), never a transaction pooler, which cannot carry the advisory lock `prisma migrate` takes. The schema
# declares `directUrl = env("DIRECT_URL")`; only a Prisma command that CONNECTS reads it (the pre-deploy step below — or, on the free
# plan, the end of the build command), so only the web service needs it. The running app never reads it.
#
# This file does NOT affect the existing static site that serves
# nextwave-wellness.com — manually created Render services ignore render.yaml.
#
# Values marked sync:false are NOT stored in this file — Render prompts for
# them at deploy time. Never commit secrets here; this file is public in the
# repo.

services:
  - type: web
    name: nextwave-scheduling
    runtime: node
    # A PAID plan, for two reasons. (1) `preDeployCommand` below is not available on the free
    # plan. (2) The web service now also answers the text-message provider's STOP / HELP webhook
    # (POST /api/sms/inbound); a free service that has gone to sleep takes ~30 s to wake, longer
    # than the provider waits. 0.5c-512mb is Render's entry paid size (the tier the dashboard calls
    # Starter; the blueprint spec takes the size name, not "starter"). APPROVED by the owner.
    plan: 0.5c-512mb
    rootDir: server
    # --include=dev is required. NODE_ENV=production (set below, correctly, for
    # the runtime) makes npm skip devDependencies — which is where typescript,
    # @types/node, the Prisma CLI and tsx all live. Without this the build dies
    # on "TS2688: Cannot find type definition file for 'node'", and the seed would
    # later fail too because tsx would be absent.
    #
    # The BUILD touches no database. `prisma generate` and the TypeScript build read only the
    # schema, so Render's build servers (which have no fixed IP addresses) never need to reach
    # DATABASE_URL, whatever allow-list the database has.
    #
    # Migrations and the seed run in `preDeployCommand`: after the build, before the new version
    # takes traffic, and a failure stops the deploy. `npm run seed` runs on EVERY deploy,
    # deliberately: migrations create empty tables, so without it the booking page has no
    # services to offer. It only ever populates an EMPTY database (it skips when any Service
    # exists), so admin edits and deletions survive every deploy, and it runs in ONE transaction,
    # so a failure leaves the database empty and re-runnable rather than half-populated. It never
    # touches Booking, User or VisitNote. The ONE thing it does on every run, skip or not, is the first administrator:
    # if ADMIN_EMAIL is set and no Account has that address, it creates the account and prints a one-time setup link to
    # THIS log (never a password) — see ADMIN_EMAIL below. It never fails the deploy.
    #
    # NOTE — the pre-deploy step runs on Render's infrastructure, so DIRECT_URL (the connection migrations use)
    # must be reachable from there. If your Postgres allow-lists IP addresses, run migrations from CI
    # instead and drop this line.
    #
    # `npm run migrate:deploy` is `prisma migrate deploy`. Every Prisma command loads prisma.config.ts first, which refuses — with a
    # message, before touching the database — a missing DIRECT_URL in production, a DIRECT_URL that is a transaction pooler (port 6543
    # or ?pgbouncer=true), and one without ?sslmode=require. (In development it falls back to DATABASE_URL; production never does.)
    # Without DIRECT_URL, migrating through a transaction pooler does not fail: it HANGS on the advisory lock. This turns that into a
    # one-line error.
    #
    # FREE PLAN, or a service you created by hand in the dashboard: there is no `preDeployCommand`, so migrations and the seed run at
    # the END OF THE BUILD instead. In the dashboard set Root Directory `server`, Start Command `npm start`, and Build Command EXACTLY:
    #
    #   npm ci --include=dev && npx prisma generate && npm --prefix web ci --include=dev && npm --prefix web run build && npm run build && npm run migrate:deploy && npm run seed
    #
    # with these Environment variables (build commands can read them): NODE_ENV=production, DATABASE_URL (the pooler, as below), and
    # DIRECT_URL (REQUIRED: direct connection or session pooler on port 5432, ?sslmode=require — never the transaction pooler), plus
    # APP_BASE_URL and MFA_ENCRYPTION_KEY. Migrations come last so a compile error never leaves the database migrated ahead of the code;
    # a failed migration fails the build, so the old version keeps serving. The build must then reach the database (Supabase has no IP
    # allow-list by default). The free plan sleeps when idle: see the plan note above for what that costs.
    # The staff app (React + Vite, in web/) is built into public/app, which
    # Express serves at /app. It has its own package.json, hence its own install.
    buildCommand: npm ci --include=dev && npx prisma generate && npm --prefix web ci --include=dev && npm --prefix web run build && npm run build
    preDeployCommand: npm run migrate:deploy && npm run seed
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      # Set in the Render dashboard; never stored here. The URL must require TLS
      # (end it ?sslmode=require): production refuses to start otherwise.
      # What the APP uses. On Supabase: the transaction pooler, e.g.
      #   postgresql://postgres.<ref>:<password>@aws-0-<region>.pooler.supabase.com:6543/postgres?pgbouncer=true&sslmode=require
      - key: DATABASE_URL
        sync: false

      # What MIGRATIONS use (the pre-deploy step above). A direct connection, or Supabase's SESSION pooler on port 5432 — NOT the
      # transaction pooler, and no ?pgbouncer=true. Must also end ?sslmode=require. Required here: the pre-deploy step refuses to
      # run without it in production. (The cron job below does not need it: it runs no migrations.) E.g.
      #   postgresql://postgres.<ref>:<password>@aws-0-<region>.pooler.supabase.com:5432/postgres?sslmode=require
      # If the database is not behind a pooler at all, set it to the same value as DATABASE_URL.
      - key: DIRECT_URL
        sync: false

      - key: NODE_ENV
        value: production

      # US Central. Must stay an IANA zone name, never a fixed offset, or every
      # appointment shifts an hour at the DST switch.
      - key: CLINIC_TIMEZONE
        value: America/Chicago

      - key: HOLD_TTL_MINUTES
        value: "10"

      # demo | beta | live — drives the patient-facing banner. Stays "demo"
      # until the practice opens and real patients can book.
      # coming_soon | demo | beta | live. Use coming_soon once the marketing
      # site links here but the practice has not opened.
      - key: BOOKING_MODE
        value: demo

      # Shown on the coming-soon page, e.g. "November".
      - key: OPENING_WHEN
        value: ""

      # Staff can reach the real flow at /?preview=<this> while the public
      # sees coming-soon. Set in the dashboard; not a security control.
      - key: PREVIEW_KEY
        sync: false

      # The shared Basic Auth curtain is RETIRED — individual logins replace it.
      # Flip to "on" (and set DEMO_USER / DEMO_PASSWORD) only to fall back during
      # cutover.
      - key: BASIC_AUTH_GATE
        value: "off"
      - key: DEMO_USER
        sync: false
      - key: DEMO_PASSWORD
        sync: false

      # Public https origin, for one-time setup links and for verifying the text-message
      # provider's webhook signature (it signs the exact public URL).
      - key: APP_BASE_URL
        sync: false

      # The clinic's phone number, shown in the reply to a patient who texts HELP. Optional: it defaults
      # to the number published on the website, (308) 830-1951 (server/src/clinicContact.ts).
      #   - key: CLINIC_PHONE
      #     sync: false

      # Twilio. Texts are sent through Twilio only when BOTH of these are set; with one alone, or neither, they
      # go to the local stub and nothing is sent. The token is also the key the two webhooks
      # (/api/sms/inbound and /api/sms/status) are verified against; with NODE_ENV=production and no token they
      # refuse every request. Set the SAME values on the cron job below, which is what sends the texts.
      #   - key: TWILIO_ACCOUNT_SID
      #     sync: false
      #   - key: TWILIO_AUTH_TOKEN
      #     sync: false

      # Staging with FAKE patients only: lets the AI scribe run on the local stub storage and scribe
      # (it is switched off in production while either is a stub). Never set where real patients are
      # seen; real S3 / Transcribe Medical / Bedrock adapters replace the need for it (docs/PHASE4_NOTES.md §6).
      #   - key: ALLOW_STUB_INTEGRATIONS
      #     value: "true"

      # Encrypts authenticator secrets. Generate locally with `npm run gen-secrets`
      # and paste it in. Never commit it; losing it invalidates every enrolment.
      - key: MFA_ENCRYPTION_KEY
        sync: false

      # The FRONT_DESK_TOKEN that used to live here is gone: staff sign in
      # individually. The FIRST admin comes from ADMIN_EMAIL: set it (and APP_BASE_URL / MFA_ENCRYPTION_KEY, above) and deploy.
      # The seed step then creates the account if no account has that address — even when the services were seeded long ago —
      # and prints a one-time setup link (24 hours, single use) in the deploy log: the pre-deploy log, or on the free plan the end
      # of the build log. Search it for "FIRST ADMINISTRATOR SETUP LINK". No shell needed. It prints nothing once the account
      # exists, and does nothing if a different administrator already does. Optional ADMIN_NAME sets the display name.
      #   - key: ADMIN_EMAIL
      #     sync: false

  # Scheduled jobs: appointment confirmation and reminder texts, and (Phase 3) the monthly credit
  # grant and credit expiry. One short process every five minutes; every job is idempotent, so an
  # overlapping or repeated run does no harm. Cron jobs have no free plan; the entry paid size below
  # is APPROVED by the owner (as is the web service's).
  #
  # sync:false values cannot live in an environment group, so the secrets are declared on each
  # service and must be entered for BOTH — the same values as the web service above.
  - type: cron
    name: nextwave-jobs
    runtime: node
    plan: 0.5c-512mb
    rootDir: server
    schedule: "*/5 * * * *"
    buildCommand: npm ci --include=dev && npx prisma generate
    startCommand: npm run jobs:run
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLINIC_TIMEZONE
        value: America/Chicago
      # The same Postgres as the web service, through the same (pooled) URL. Must end ?sslmode=require. No DIRECT_URL here: this
      # job runs no migrations, and `prisma generate` in its build needs no database.
      - key: DATABASE_URL
        sync: false
      # config.ts enforces its production guards in this process too.
      - key: APP_BASE_URL
        sync: false
      - key: MFA_ENCRYPTION_KEY
        sync: false
      #   - key: CLINIC_PHONE      # optional override; defaults to the published number
      #     sync: false
      #   - key: TWILIO_ACCOUNT_SID    # both of these, the same as the web service's: this job sends the texts
      #     sync: false
      #   - key: TWILIO_AUTH_TOKEN
      #     sync: false
      # Optional: days after a note is signed that raw visit audio is deleted (this job does it). Default 30.
      #   - key: AUDIO_RETENTION_DAYS
      #     value: "30"
      # Optional: the sender number (E.164). Defaults to the registered toll-free +18665241007.
      #   - key: TWILIO_FROM_NUMBER
      #     value: "+18665241007"
