# Render blueprint for the NextWave scheduling demo.
#
# Must live at the REPOSITORY ROOT — Render only looks for render.yaml here,
# not in subdirectories. `rootDir: server` below is what points the build and
# start commands at the server/ folder.
#
# In Render: New → Blueprint → connect this repo → select branch.
# Provisions the Postgres instance and the web service together and wires
# DATABASE_URL between them.
#
# This file does NOT affect the existing static site that serves
# nextwave-wellness.com — manually created Render services ignore render.yaml.
#
# Values marked sync:false are NOT stored in this file — Render prompts for
# them at deploy time. Never commit secrets here; this file is public in the
# repo.

databases:
  - name: nextwave-db
    databaseName: nextwave
    user: nextwave
    plan: free # 90-day expiry on free Postgres — move to a paid plan before it lapses

services:
  - type: web
    name: nextwave-scheduling
    runtime: node
    plan: free # sleeps after ~15 min idle; first request back takes ~30s
    rootDir: server
    # --include=dev is required. NODE_ENV=production (set below, correctly, for
    # the runtime) makes npm skip devDependencies — which is where typescript,
    # @types/node, the Prisma CLI and tsx all live. Without this the build dies
    # on "TS2688: Cannot find type definition file for 'node'", and `npm run
    # seed` would later fail too because tsx would be absent.
    #
    # `npm run seed` runs on EVERY deploy, deliberately: migrations create empty
    # tables, so without it the booking page has no services to offer. It only
    # ever populates an EMPTY database (it skips when any Service exists), so
    # admin edits and deletions survive every deploy, and it runs in ONE
    # transaction, so a failure leaves the database empty and re-runnable rather
    # than half-populated. It never touches Booking, User, VisitNote, Account or
    # the audit log.
    #
    # The staff app (React + Vite, in web/) is built into public/app, which
    # Express serves at /app. It has its own package.json, hence its own install.
    buildCommand: npm ci --include=dev && npx prisma generate && npx prisma migrate deploy && npm --prefix web ci --include=dev && npm --prefix web run build && npm run build && npm run seed
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      # Set in the Render dashboard, NOT wired to the database above. Two reasons:
      #  1. In production the app refuses to start unless the URL requires TLS
      #     (it must end in ?sslmode=require), and Render's generated connection
      #     string does not add that.
      #  2. A blueprint sync would otherwise overwrite a value you set by hand.
      - key: DATABASE_URL
        sync: false

      - key: NODE_ENV
        value: production

      # US Central. Must stay an IANA zone name, never a fixed offset, or every
      # appointment shifts an hour at the DST switch.
      - key: CLINIC_TIMEZONE
        value: America/Chicago

      - key: HOLD_TTL_MINUTES
        value: "10"

      # demo | beta | live — drives the patient-facing banner. Stays "demo"
      # until the practice opens and real patients can book.
      # coming_soon | demo | beta | live. Use coming_soon once the marketing
      # site links here but the practice has not opened.
      - key: BOOKING_MODE
        value: demo

      # Shown on the coming-soon page, e.g. "November".
      - key: OPENING_WHEN
        value: ""

      # Staff can reach the real flow at /?preview=<this> while the public
      # sees coming-soon. Set in the dashboard; not a security control.
      - key: PREVIEW_KEY
        sync: false

      # The shared Basic Auth curtain is RETIRED — individual logins replace it.
      # Flip to "on" (and set DEMO_USER / DEMO_PASSWORD) only to fall back during
      # cutover.
      - key: BASIC_AUTH_GATE
        value: "off"
      - key: DEMO_USER
        sync: false
      - key: DEMO_PASSWORD
        sync: false

      # Public https origin, for one-time setup links.
      - key: APP_BASE_URL
        sync: false

      # Encrypts authenticator secrets. Generate locally with `npm run gen-secrets`
      # and paste it in. Never commit it; losing it invalidates every enrolment.
      - key: MFA_ENCRYPTION_KEY
        sync: false

      # The FRONT_DESK_TOKEN that used to live here is gone: staff sign in
      # individually. Create the first admin from the Render shell with
      #   ADMIN_EMAIL=you@example.com npm run seed:admin
